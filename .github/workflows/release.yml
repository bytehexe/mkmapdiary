name: Publish Python 🐍 distribution 📦 to PyPI
on: push

jobs:
  test:
    name: Lint and test the code 🧪
    # Runs the full pre-commit suite (mypy, tests, ruff, translation-files)
    # with nothing skipped. This job used to run on every push and skipped
    # the slow checks for that reason (see git history: "Skip mypy in
    # workflow (takes a long time)", "fix: skip tests in the pipeline") --
    # now that it's tag-gated (fires once per release, not once per commit),
    # the wall-clock cost of running everything for real is no longer a
    # per-push tax, so there's no more reason to skip them.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install hatch pre-commit yamllint --user
      - name: Run tests
        run: |
          pre-commit run -a

  build:
    name: Build distribution 📦
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: 'pip'
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    # Was misnamed "publish-to-testpypi": there's no repository-url override
    # here, so pypa/gh-action-pypi-publish's default target is real PyPI (as
    # the environment url below always said) -- the name just never matched
    # what the job does. Renamed rather than actually pointed at TestPyPI.
    if: github.ref_type == 'tag'
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/mkmapdiary

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref_type == 'tag'
    # Previously had no `needs`, so it could create a GitHub Release even if
    # build/publish failed. Wait for a successful publish first.
    needs:
      - publish-to-pypi
    steps:
      - name: Create GitHub Release (stable)
        uses: softprops/action-gh-release@v3
        if: |
          !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')
        with:
          generate_release_notes: true
      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v3
        if: |
          contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')
        with:
          prerelease: true
          generate_release_notes: true
