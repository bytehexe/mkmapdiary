name: Deploy MkDocs to GitHub Pages

on: push

jobs:
  publish-docs:
    name: Deploy docs to GitHub Pages 📚
    # Note: Change to non-prerelease tags later
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned, not 3.x: the docs build resolves .[all], which includes
          # torch and the CUDA stack. torch lags new CPython releases by
          # months, so floating here risks a tag push failing resolution
          # for reasons unrelated to mkmapdiary. Bump deliberately.
          python-version: '3.12'
      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml
      - run: pip install mkdocs mkdocs-material plantuml-markdown
      - run: env PYTHONPATH=src:docs/ mkdocs build
      - name: Upload static files as artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
