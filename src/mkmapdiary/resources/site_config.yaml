use_directory_urls: False
strict: True

theme:
  name: material
  features:
    # Fold the table of contents into the left sidebar. Material otherwise
    # drawers the navigation below 1220px while keeping the TOC down to 960px;
    # for a journal the navigation is the more useful of the two, so collapse
    # both into one column that survives to the narrower breakpoint.
    - toc.integrate
    # Previous/next links in the footer. The navigation is ordered by date, so
    # these read as the previous and next day of the journey.
    - navigation.footer
    # Back-to-top button. Journal pages run long once a gallery and a map are
    # on them, so the way back to the header is worth a shortcut.
    # navigation.instant is deliberately absent: it needs the Fetch API, which
    # the offline plugin rules out for file:// browsing, and the scripts in
    # resources/*.js initialise on DOMContentLoaded rather than `document$`.
    - navigation.top
  logo: "logo-white.svg"
  favicon: "logo-blue.svg"
  palette:
    primary: "blue"
    accent: "blue"

plugins:
  - search
  - offline
  - glightbox:
      skip_classes:
        - skip-lightbox

copyright: 'Created with <a href="https://github.com/bytehexe/mkmapdiary">mkmapdiary</a> — <a href="credits.html">Credits</a>'

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/bytehexe/mkmapdiary"
    - icon: "simple/pypi"
      link: "https://pypi.org/project/mkmapdiary/"

exclude_docs: |
  /assets/*.md
  /assets/*.txt

markdown_extensions:
  # Only H2 reaches the table of contents. Journal pages nest an H3 per asset
  # ("Audio", "Text", …) under each section, which repeats often enough to be
  # noise in the sidebar. Headings below H2 keep their anchors either way.
  - toc:
      toc_depth: 2
  - pymdownx.snippets:
      check_paths: True
  - attr_list
  - md_in_html
  - pymdownx.blocks.html
  - pymdownx.blocks.admonition
  - pymdownx.superfences
  - tables
  - pymdownx.blocks.details

extra_css:
  - extra.css
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - https://unpkg.com/leaflet.markercluster@1.0.3/dist/MarkerCluster.css
  - https://unpkg.com/@lychee-org/leaflet.photo@1.0.0/Leaflet.Photo.css
  - https://unpkg.com/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.css
  - https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css
  - https://cdn.jsdelivr.net/npm/justifiedGallery/dist/css/justifiedGallery.min.css
  - https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css
  - https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.css


extra_javascript:
  - path: https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - path: https://unpkg.com/leaflet.markercluster@1.0.3/dist/leaflet.markercluster.js
  - path: https://unpkg.com/@lychee-org/leaflet.photo@1.0.0/Leaflet.Photo.js
  - path: https://unpkg.com/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.min.js
  - path: https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.2.0/gpx.min.js
  - path: https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js
  - path: https://cdn.jsdelivr.net/npm/justifiedGallery/dist/js/jquery.justifiedGallery.min.js
  - path: https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js
  - path: https://unpkg.com/leaflet.fullscreen@2.4.0/Control.FullScreen.js
  - path: geo.js
  - path: audio.js
  - path: gallery.js
