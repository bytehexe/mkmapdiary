$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Camera Calibration Configuration"
description: "Configuration file for camera timestamp calibration in mkmapdiary"
type: object

properties:
  calibration:
    type: object
    description: "Camera calibration settings"
    properties:
      timezone:
        type: string
        description: "Timezone of the camera timestamps (e.g., 'Europe/Berlin', 'Etc/GMT-1', or 'UTC')"
        examples:
          - "UTC"
          - "Europe/Berlin"
          - "America/New_York"
          - "Etc/GMT-3"
          - "Asia/Tokyo"
      offset:
        type: integer
        description: "Time offset in seconds to apply to camera timestamps. Positive values mean camera time is ahead of reference time."
        examples:
          - 0
          - -259
          - 3600
          - -1800
    required:
      - timezone
      - offset
    additionalProperties: false

  effects:
    type: array
    description: "List of effects to apply"
    items:
      type: string
      enum:
        - "autorotate"
      description: "Name of the effect"

  creator:
    type: ["string", "null"]
    description: >
      Name of the person who created the media in this directory. Inherited by
      subdirectories unless overridden. Set to null to clear an inherited creator.
    examples:
      - "Bob Ross"

# Note: root-level `timezone`/`offset` keys were once declared here as an
# alternative "backward compatibility" format. They never worked. Nothing reads
# them -- Calibration.resolve() looks only inside `calibration` -- and the anyOf
# below never accepted a file containing only them, so such a file failed
# validation and aborted the build. They were removed rather than implemented.

anyOf:
  - required: ["calibration"]
  - required: ["effects"]
  - required: ["creator"]

additionalProperties: true
